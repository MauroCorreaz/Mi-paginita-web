<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML</title>
</head>

<body>
    <h2> Lista de productos</h2>
    <table border="1">
        <!-- Encabezado de la tabla -->
        <thead>
            <tr>
                <th>Producto</th>
                <th>Categoria</th>
                <th>Precio</th>
            </tr>
        </thead>

        <!-- Cuerpo de la tabla -->

        <tbody>
            <tr>
                <td>Teclado Mecanico</td>
                <td>Electrónico</td>
                <td>$29.99</td>
            </tr>
            <tr>
                <td>Leche</td>
                <td>Lácteos</td>
                <td>$0.99</td>
            </tr>
            <tr>
                <td>Pan</td>
                <td>Panadería</td>
                <td>$2.00</td>
            </tr>
    </table>
</body>

</html>
